# OpsDesk on one machine: the database, the backend and the frontend.
#
#   cp .env.example .env      then put real values in .env
#   docker compose up --build
#   open http://localhost:3000
#
# Expects opsdesk-backend and opsdesk-frontend checked out next to this folder.
# `docker compose down` stops everything and KEEPS the data (it's in the
# db-data volume); `docker compose down -v` deletes the data as well.
#
# Values marked ${...} come from .env in this folder (see .env.example);
# everything else is the same on every machine, so it's written here.
#
# ${NAME:?message} makes a missing or empty value stop `docker compose` itself,
# before it builds or creates anything, with the message. A plain ${NAME}
# only WARNS and substitutes "": measured without a .env, compose then built
# both images, started the frontend, and the database exited ("superuser
# password is not specified"), so the backend never even started and its own
# check (RequiredSettingsCheck, JwtService) never ran. That check still
# matters for values compose can't judge: a JWT_SECRET that is set but too
# short, as in an unedited copy of .env.example.

name: opsdesk

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: opsdesk
      POSTGRES_USER: opsdesk
      # Read only when the volume is empty, on the very first start.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?is not set. Copy .env.example to .env in this folder and set it}
    volumes:
      # A named volume: managed by Docker, outlives every container, so the
      # data survives `down` and `up`, and rebuilt images.
      - db-data:/var/lib/postgresql/data
    # No published port. Only the backend, on this compose network, reaches
    # the database; nothing on the host can, and it can't clash with another
    # Postgres on the host's 5432 or 5433.
    healthcheck:
      # -h localhost makes this a TCP check. On the very first start the image
      # runs a temporary server on a Unix socket only, to create the user and
      # database, then restarts; a socket check can say "ready" during that,
      # and the backend would connect to a server about to go away.
      test: ["CMD-SHELL", "pg_isready -h localhost -U opsdesk -d opsdesk"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ../opsdesk-backend
    environment:
      # Production rules: no defaults, no sample data (decisions 68 and 69).
      SPRING_PROFILES_ACTIVE: prod
      # "db" is the database service's name on this network. Not localhost:
      # inside this container, localhost is the backend container itself.
      DB_URL: jdbc:postgresql://db:5432/opsdesk
      DB_USER: opsdesk
      DB_PASSWORD: ${DB_PASSWORD:?is not set. Copy .env.example to .env in this folder and set it}
      JWT_SECRET: ${JWT_SECRET:?is not set. Copy .env.example to .env in this folder and set it}
      # Where the browser loads the frontend from: the frontend's published port.
      ALLOWED_ORIGIN: http://localhost:3000
    depends_on:
      db:
        # Waits for the db healthcheck to pass, not just for the container to
        # start: Postgres takes a few seconds to accept connections.
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      # Healthy only while Actuator answers 200 {"status":"UP"}: Spring has
      # finished starting and the database is reachable (it answers 503 DOWN
      # without one). BusyBox wget, which the JRE image has, exits non-zero on
      # any 4xx or 5xx. The EXACT path, no trailing slash: /actuator/health/
      # answers 401 without a token (decision 74), so that check would never
      # pass. Without this, `docker compose up --wait` called the backend
      # healthy while Spring was still starting.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # Failures in the first 40 s don't count: Spring takes about 7 s to start.
      start_period: 40s

  frontend:
    build:
      context: ../opsdesk-frontend
      args:
        # BAKED INTO THE BUNDLE when the image is built. Changing it here takes
        # `docker compose up --build`; a restart keeps the old value.
        # It's the address the BROWSER uses, on the host, so it's the
        # backend's published port: http://backend:8080 would mean nothing
        # to the browser, since only containers on this network resolve it.
        VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:80"

volumes:
  db-data:
